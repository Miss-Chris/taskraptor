[project]
name = "taskraptor"
version = "0.1.0"
description = "TaskRaptor API"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1",
    "django-ninja>=1.3",
    "litellm>=1.60",
    "psycopg[binary]>=3.2",
    "pydantic>=2.0",
    "python-decouple>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "taskraptor.settings.test"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-m 'not live_api and not benchmark'"
markers = [
    "live_api: marks tests that call the live Anthropic API (deselected by default; run with -m live_api)",
    "benchmark: multi-turn live API benchmark for token/tool/task metrics (deselected by default; run with -m benchmark)",
]

[tool.uv]
package = false
