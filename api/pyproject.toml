[project]
name = "taskraptor"
version = "0.1.0"
description = "TaskRaptor API"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1",
    "django-ninja>=1.3",
    "psycopg[binary]>=3.2",
    "python-decouple>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "taskraptor.settings.test"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.uv]
package = false
