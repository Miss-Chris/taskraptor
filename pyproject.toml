[project]
name = "taskraptor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django==5.1.4",
    "django-ninja==1.3.0",
    "psycopg[binary]==3.2.3",
    "celery==5.4.0",
    "redis==5.2.0",
    "whitenoise==6.8.2",
    "gunicorn==23.0.0",
    "python-dotenv==1.0.1",
    "anthropic>=0.40.0",
    "pydantic>=2.7.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-django==4.9.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "taskraptor.settings.local"
pythonpath = ["."]
