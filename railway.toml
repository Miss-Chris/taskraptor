[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = [
  "railway.toml",
  "Dockerfile",
  "docker/**",
  "frontend/**",
  "apps/**",
  "taskraptor/**",
  "pyproject.toml",
  "uv.lock",
  "Taskfile.yml",
  "manage.py",
]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
